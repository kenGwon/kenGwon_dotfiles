# Esc 키 지연 시간 제거 (Alt+j → Esc+j 오해석 방지)
set -sg escape-time 0

# FocusGained/FocusLost 이벤트를 nvim 등으로 전달
set -g focus-events on

# window renumbering 
set -g renumber-windows on

# 이동도 repeat 적용
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Toglle last active window 키 충돌 다시 바인딩
bind "'" last-window

# Toglle last active session 키 충돌 다시 바인딩
bind "/" switch-client -l

# 크기 조절
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# 새 창을 현재 경로로 열기 (prefix + c 덮어쓰기)
bind c new-window -c "#{pane_current_path}"

# 새 pane을 현재 경로로 열기 (수평/수직 분할도 함께)
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# tmux popup 설정
bind C-w display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-o if-shell -F '#{==:#{session_name},popup}' \
    'detach-client' \
    'display-popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E "tmux attach-session -t popup || tmux new-session -s popup"'
bind C-g display-popup \
	-d "#{pane_current_path}" \
	-w 80% \
	-h 80% \
	-E "lazygit"
bind C-_ display-popup \
    -w 50% \
    -h 50% \
    -E "printf 'C-w: fzf session switcher\nC-o: popup scratch session\nC-g: lazygit\n' | less"

# 복사모드 설정
set-option -g history-limit 50000
set-window-option -g mode-keys vi
set -g mouse on

# 상태바 갱신 주기 (기본 15초 → 1초)
set -g status-interval 15

# 왼쪽: 세션명
set -g status-left '[#S] '
set -g status-left-length 20

# 오른쪽: 호스트명 + 시간
set -g status-right '#H | %Y-%m-%d %H:%M'
set -g status-right-length 50

# 비활성/활성 윈도우 구분
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
set -g window-status-current-format "\
#[fg=yellow,bg=green]${HALF_ROUND_OPEN}\
#[fg=black,bg=yellow]#I:#W#F\
#[fg=yellow,bg=green]${HALF_ROUND_CLOSE}\
"

# Terminal 색상 설정 값 미리 전달하여
# 리터럴 문자출력 방지 (256색 + RGB 지원)
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# TPM 없으면 자동 설치 후 플러그인까지 설치
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bindings/install_plugins'"

# TPM 플러그인 셋업
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: 15분마다 자동 저장, tmux 시작 시 자동 복원
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 초기화 (반드시 .tmux.conf 맨 마지막 줄)
# ## tmux key bind은 자동으로 되어있음
# ## C-b C-s: session save
# ## C-b C-r: session restore
run '~/.tmux/plugins/tpm/tpm'

